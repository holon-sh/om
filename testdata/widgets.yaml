openapi: 3.0.4
info:
  title: Widgets
  version: '1'
  description: Example API
servers:
  - url: https://{region}.example.test/v1
    variables:
      region:
        default: us
        enum: [us, eu]
security:
  - widget-key: []
paths:
  /widgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Widget identifier
        schema:
          type: string
          pattern: '^[a-z/\:]+$'
    get:
      operationId: constructor
      parameters:
        - name: filter
          in: query
          style: deepObject
          allowEmptyValue: true
          allowReserved: true
          schema:
            $ref: '#/components/schemas/Filter'
      responses:
        '200':
          description: Widget
    post:
      operationId: update-widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              x-mcp-header: X-Widget-Body
              properties:
                name:
                  type: string
                  pattern: '^(?!\s)'
      responses:
        '200':
          description: Updated
  /upload:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        '200':
          description: Uploaded
components:
  securitySchemes:
    widget-key:
      type: apiKey
      name: X-Widget-Key
      in: header
  schemas:
    Filter:
      type: object
      $recursiveAnchor: true
      properties:
        min:
          $ref: '#/components/schemas/Bounds/properties/minimum%25'
        category:
          type: string
          nullable: true
    Bounds:
      type: object
      properties:
        minimum%:
          type: integer
          minimum: 0
          exclusiveMinimum: true
