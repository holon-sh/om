name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: go vet ./...
      - run: go test -race ./...
        env:
          OM_TEST_NODE: '1'
      - run: |
          go run ./cmd/om generate testdata/widgets.yaml "$RUNNER_TEMP/widgets"
          cd "$RUNNER_TEMP/widgets"
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund typescript@7.0.2 @types/node@24.19.2
          npx tsc --noEmit --strict --erasableSyntaxOnly --verbatimModuleSyntax --module nodenext --target esnext --types node server.ts
