<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>om</title>
  <!-- Gopher-style art after the Go gopher by Renee French, licensed CC BY 4.0. -->
  <defs>
    <radialGradient id="fur" cx="0.42" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#78D7F0"/>
      <stop offset="0.7" stop-color="#58C6E8"/>
      <stop offset="1" stop-color="#3FB0DA"/>
    </radialGradient>
    <clipPath id="page"><rect width="84" height="106" rx="9"/></clipPath>
    <mask id="bite">
      <rect x="-20" y="-20" width="130" height="150" fill="#fff"/>
      <circle cx="26" cy="0" r="12" fill="#000"/>
      <circle cx="42" cy="-3" r="13" fill="#000"/>
      <circle cx="58" cy="0" r="12" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="#E3F5FB"/>

  <g stroke="#1F2D3A" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- feet -->
    <ellipse cx="194" cy="458" rx="27" ry="13" fill="#F1DFB0" transform="rotate(-14 194 458)"/>
    <ellipse cx="318" cy="458" rx="27" ry="13" fill="#F1DFB0" transform="rotate(14 318 458)"/>

    <!-- ears -->
    <circle cx="142" cy="98" r="21" fill="#58C6E8"/>
    <circle cx="370" cy="98" r="21" fill="#58C6E8"/>

    <!-- body -->
    <path d="M256 66 C340 66 396 104 398 176 C400 236 404 290 416 346 C430 424 358 456 256 456 C154 456 82 424 96 346 C108 290 112 236 114 176 C116 104 172 66 256 66 Z" fill="url(#fur)"/>

    <!-- big round eyes, crossed on the snack -->
    <circle cx="196" cy="150" r="60" fill="#fff"/>
    <circle cx="316" cy="150" r="60" fill="#fff"/>
    <circle cx="216" cy="170" r="16" fill="#111" stroke="none"/>
    <circle cx="296" cy="170" r="16" fill="#111" stroke="none"/>
    <circle cx="221" cy="164" r="4.5" fill="#fff" stroke="none"/>
    <circle cx="301" cy="164" r="4.5" fill="#fff" stroke="none"/>

    <!-- the snack: an OpenAPI doc, bitten -->
    <g transform="translate(214 246) rotate(-6)">
      <g mask="url(#bite)">
        <rect width="84" height="106" rx="9" fill="#fff"/>
        <text x="42" y="64" text-anchor="middle" font-family="Menlo, ui-monospace, monospace" font-weight="700" font-size="34" fill="#00ADD8" stroke="none">{ }</text>
        <g stroke="#C9D3DA" stroke-width="5.5">
          <path d="M18 82 H66"/>
          <path d="M18 94 H50"/>
        </g>
      </g>
      <g clip-path="url(#page)" fill="none" stroke-width="5">
        <circle cx="26" cy="0" r="12"/>
        <circle cx="42" cy="-3" r="13"/>
        <circle cx="58" cy="0" r="12"/>
      </g>
    </g>

    <!-- buck teeth, sunk into the bite -->
    <rect x="243" y="212" width="13" height="36" rx="3" fill="#fff" stroke-width="5"/>
    <rect x="256" y="212" width="13" height="36" rx="3" fill="#fff" stroke-width="5"/>

    <!-- snout and nose -->
    <ellipse cx="256" cy="210" rx="30" ry="19" fill="#F1DFB0"/>
    <path d="M238 192 Q256 182 274 192 Q276 200 256 208 Q236 200 238 192 Z" fill="#5E5856" stroke-width="5"/>

    <!-- little paws -->
    <ellipse cx="220" cy="318" rx="12" ry="18" fill="#F1DFB0" transform="rotate(-18 220 318)"/>
    <ellipse cx="305" cy="306" rx="12" ry="18" fill="#F1DFB0" transform="rotate(18 305 306)"/>

    <!-- crumbs -->
    <g fill="#fff" stroke-width="3.5">
      <rect x="282" y="226" width="9" height="9" rx="2" transform="rotate(20 286 230)"/>
      <rect x="298" y="240" width="7" height="7" rx="2" transform="rotate(-15 301 243)"/>
      <rect x="212" y="232" width="8" height="8" rx="2" transform="rotate(30 216 236)"/>
    </g>
  </g>
</svg>
